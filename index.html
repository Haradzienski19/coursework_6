<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛитОбзор</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0a0a0f; --bg2: #12121a; --bg3: #1a1a2e; --bg-card: #16213e;
            --accent: #6c63ff; --accent2: #7f78ff; --glow: rgba(108,99,255,0.3);
            --text: #e8e8f0; --text2: #9898b0; --muted: #68688099;
            --border: #2a2a40; --ok: #4ecdc4; --warn: #ffe66d; --err: #ff6b6b;
            --r: 16px; --rs: 10px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }
        ::-webkit-scrollbar{width:6px} ::-webkit-scrollbar-track{background:var(--bg2)}
        ::-webkit-scrollbar-thumb{background:#2a2a40;border-radius:3px}
        ::-webkit-scrollbar-thumb:hover{background:var(--accent)}

        .app{display:flex;height:100vh}
        .sidebar{width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column}
        .sidebar h1{padding:24px 20px;border-bottom:1px solid var(--border);font-size:20px;font-weight:700;color:var(--accent)}
        .status-bar{padding:12px 20px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px}
        .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
        .dot.err{background:var(--err)} .dot.busy{background:var(--warn);animation:pulse 0.5s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
        .sources{padding:16px 20px;flex:1;overflow-y:auto}
        .sources h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
        .src{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;color:var(--text2)}
        .ai-badge{margin:12px 20px;padding:10px 14px;background:rgba(108,99,255,0.1);border:1px solid rgba(108,99,255,0.3);border-radius:var(--rs);font-size:11px;color:var(--accent)}

        .main{flex:1;display:flex;flex-direction:column;min-width:0}
        .topbar{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:space-between}
        .topbar h2{font-size:16px;font-weight:600}
        .topbar-actions button{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:8px 16px;border-radius:var(--rs);cursor:pointer;font-size:12px;transition:all 0.2s}
        .topbar-actions button:hover{color:var(--text);border-color:var(--accent)}

        .msgs{flex:1;overflow-y:auto;padding:24px;scroll-behavior:smooth}
        .welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:40px}
        .welcome h2{font-size:28px;font-weight:700;margin-bottom:12px;color:var(--accent)}
        .welcome p{color:var(--text2);max-width:600px;line-height:1.6;margin-bottom:32px}

        .msg{display:flex;gap:12px;margin-bottom:24px;animation:msgIn 0.4s ease-out;max-width:1000px;margin-left:auto;margin-right:auto}
        @keyframes msgIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        .msg.user{flex-direction:row-reverse}
        .msg-ava{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;font-weight:bold;color:white}
        .msg.bot .msg-ava{background:linear-gradient(135deg,var(--accent),var(--ok))}
        .msg.user .msg-ava{background:linear-gradient(135deg,#ff6b6b,#ffa07a)}
        .msg-body{max-width:90%;min-width:200px}
        .bubble{padding:16px 20px;border-radius:var(--r);line-height:1.6;font-size:14px;width:100%}
        .msg.bot .bubble{background:var(--bg3);border:1px solid var(--border);border-top-left-radius:4px}
        .msg.user .bubble{background:var(--accent);border-top-right-radius:4px}
        .msg-time{font-size:11px;color:var(--muted);margin-top:6px;padding:0 4px}
        .msg.user .msg-time{text-align:right}

        .charts-container { display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
        .chart-box { flex: 1; min-width: 300px; background: var(--bg2); padding: 15px; border-radius: var(--r); border: 1px solid var(--border); }
        .chart-box canvas { max-height: 250px; }
        
        .pros-cons { display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
        .pc-box { flex: 1; min-width: 250px; background: var(--bg2); padding: 15px; border-radius: var(--r); border: 1px solid var(--border); }
        .pc-box h4 { margin-bottom: 10px; font-size: 14px; }
        .pc-box.pros h4 { color: var(--ok); }
        .pc-box.cons h4 { color: var(--err); }
        .pc-box ul { padding-left: 20px; color: var(--text2); font-size: 13px; }
        .pc-box li { margin-bottom: 5px; }

        .source-links { margin: 16px 0 12px 0; }
        .source-links a { display: inline-block; margin: 5px 5px 0 0; padding: 8px 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rs); color: var(--accent); text-decoration: none; font-size: 12px; transition: all 0.2s; }
        .source-links a:hover { border-color: var(--accent); background: rgba(108,99,255,0.1); }

        .input-area{padding:20px 24px;border-top:1px solid var(--border);background:var(--bg2)}
        .input-wrap{display:flex;gap:12px;align-items:flex-end;max-width:1000px;margin:0 auto}
        .input-wrap textarea{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;color:var(--text);font-size:14px;font-family:inherit;resize:none;outline:none;transition:all 0.2s;min-height:50px;max-height:150px;line-height:1.5}
        .input-wrap textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
        .send-btn{width:50px;height:50px;background:var(--accent);border:none;border-radius:var(--r);color:white;font-size:14px;font-weight:bold;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .send-btn:hover{background:var(--accent2);transform:scale(1.05)}
        .send-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <h1>ЛитОбзор</h1>
        <div class="status-bar"><div class="dot" id="dot"></div><span id="stxt">Connecting...</span></div>
        <div class="sources">
            <h3>Источники</h3>
            <div class="src">Goodreads</div>
            <div class="src">Fantlab</div>
            <div class="src">Labirinth</div>
        </div>
    </aside>

    <main class="main">
        <div class="topbar">
            <h2>Анализ Обзоров</h2>
            <div class="topbar-actions">
                <button onclick="clearChat()">Очистить</button>
            </div>
        </div>
        <div class="msgs" id="msgs">
            <div class="welcome" id="welcome">
                <h2>ЛитОбзор</h2>
                <p>Введите название книги. Система произведёт поиск книги по интернет-ресурсам и затем предоставит анализ обзоров на неё.</p>
            </div>
        </div>
        <div class="input-area">
            <div class="input-wrap">
                <textarea id="inp" placeholder="Введите название книги..." rows="1"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
                    oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,150)+'px'"></textarea>
                <button class="send-btn" id="btn" onclick="send()">ОТПР</button>
            </div>
        </div>
    </main>
</div>

<script>
let busy = false;

function renderSourceAnalysis(src) {
    const a = src.analysis || {};
    const s = a.sentiment || {positive: 0, neutral: 0, negative: 0};
    const posThemes = (a.positive_themes || []).map(t => t.theme).join(', ') || 'нет данных';
    const negThemes = (a.negative_themes || []).map(t => t.theme).join(', ') || 'нет данных';
    const summary = a.summary || 'Нет краткого вывода.';

    let cloudsHtml = '';
    if (src.wordclouds) {
        cloudsHtml += '<div class="charts-container">';
        if (src.wordclouds.positive) {
            cloudsHtml += '<div class="chart-box">';
            cloudsHtml += '<h4>Облако слов: позитивные отзывы</h4>';
            cloudsHtml += '<img src="' + src.wordclouds.positive + '" style="width:100%;height:auto;border-radius:12px;display:block;">';
            cloudsHtml += '</div>';
        }
        if (src.wordclouds.negative) {
            cloudsHtml += '<div class="chart-box">';
            cloudsHtml += '<h4>Облако слов: негативные отзывы</h4>';
            cloudsHtml += '<img src="' + src.wordclouds.negative + '" style="width:100%;height:auto;border-radius:12px;display:block;">';
            cloudsHtml += '</div>';
        }
        cloudsHtml += '</div>';
    }

    return '<div class="pc-box" style="margin-top:12px;">' +
        '<h4>' + src.site + ' (' + src.review_count + ' отзывов)</h4>' +
        '<p>Сентимент: + ' + s.positive + '% / нейтр. ' + s.neutral + '% / - ' + s.negative + '%</p>' +
        '<p><strong>Позитивные темы:</strong> ' + posThemes + '</p>' +
        '<p><strong>Негативные темы:</strong> ' + negThemes + '</p>' +
        '<p><strong>Вывод:</strong> ' + summary + '</p>' +
        cloudsHtml +
        '</div>';
}

function addMsg(type, html, chartData=null, wordclouds=null) {
    const m = document.getElementById('msgs');
    const w = document.getElementById('welcome');
    if (w) w.remove();
    const t = new Date().toLocaleTimeString();
    const av = type === 'user' ? 'USR' : 'SYS';
    const cls = type === 'user' ? 'user' : 'bot';

    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg ' + cls;
    msgDiv.innerHTML = '<div class="msg-ava">' + av + '</div><div class="msg-body"><div class="bubble">' + html + '</div><div class="msg-time">' + t + '</div></div>';
    m.appendChild(msgDiv);

    if (chartData) {
        const cid1 = 'c1_' + Date.now();
        const cid2 = 'c2_' + Date.now();

        let extraHtml = '<div class="charts-container">' +
            '<div class="chart-box"><canvas id="' + cid1 + '"></canvas></div>' +
            '<div class="chart-box"><canvas id="' + cid2 + '"></canvas></div>' +
            '</div>';

        if (wordclouds) {
            extraHtml += '<div class="charts-container">';
            if (wordclouds.positive) {
                extraHtml += '<div class="chart-box"><h4>Общее облако слов: позитивные отзывы</h4><img src="' + wordclouds.positive + '" style="width:100%;height:auto;border-radius:12px;display:block;"></div>';
            }
            if (wordclouds.negative) {
                extraHtml += '<div class="chart-box"><h4>Общее облако слов: негативные отзывы</h4><img src="' + wordclouds.negative + '" style="width:100%;height:auto;border-radius:12px;display:block;"></div>';
            }
            extraHtml += '</div>';
        }

        msgDiv.querySelector('.bubble').innerHTML += extraHtml;

        setTimeout(() => {
            const positiveThemes = chartData.positive_themes || [];
            const negativeThemes = chartData.negative_themes || [];

            new Chart(document.getElementById(cid1), {
                type: 'bar',
                data: {
                    labels: positiveThemes.length ? positiveThemes.map(t => t.theme) : ['Нет данных'],
                    datasets: [{
                        label: 'Positive Themes',
                        data: positiveThemes.length ? positiveThemes.map(t => t.score) : [0],
                        backgroundColor: '#4ecdc4'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { title: { display: true, text: 'Темы в положительных отзывах' } },
                    indexAxis: 'y'
                }
            });

            new Chart(document.getElementById(cid2), {
                type: 'bar',
                data: {
                    labels: negativeThemes.length ? negativeThemes.map(t => t.theme) : ['Нет данных'],
                    datasets: [{
                        label: 'Negative Themes',
                        data: negativeThemes.length ? negativeThemes.map(t => t.score) : [0],
                        backgroundColor: '#ff6b6b'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { title: { display: true, text: 'Темы в негативных отзывах' } },
                    indexAxis: 'y'
                }
            });
        }, 100);
    }

    m.scrollTop = m.scrollHeight;
}

async function send() {
    const inp = document.getElementById('inp');
    const q = inp.value.trim();
    if (!q || busy) return;
    busy = true;
    document.getElementById('btn').disabled = true;
    document.getElementById('dot').className = 'dot busy';
    document.getElementById('stxt').textContent = 'Обработка...';

    addMsg('user', q);
    inp.value = ''; inp.style.height = 'auto';

    try {
        const r = await fetch('/api/search', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({query: q})
        });
        const data = await r.json();
        
        if (!data.sources || data.sources.length === 0) {
            addMsg('bot', 'No reviews found across targeted sources.');
        } else {
            const overall = data.overall_analysis || data.analysis || {};
            const overallSent = overall.sentiment || {positive: 0, neutral: 0, negative: 0};
            
            let html = '<div>Анализ завершен для: <strong>' + q + '</strong></div>';
            
            html += '<div class="source-links"><strong>Источники:</strong><br>';
            data.sources.forEach(s => {
                html += '<a href="' + s.url + '" target="_blank">' + s.site + '</a>';
            });
            html += '</div>';
            
            html += '<div class="pc-box" style="margin-top:16px;">';
            html += '<h4>Итоговый анализ</h4>';
            html += '<p><strong>Сентимент:</strong> положительные ' + overallSent.positive + '%, нейтральные ' + overallSent.neutral + '%, негативные ' + overallSent.negative + '%</p>';
            html += '<p><strong>Вывод:</strong> ' + (overall.summary || 'Нет краткого вывода.') + '</p>';
            html += '<p><strong>Плюсы:</strong> ' + ((overall.pros || []).join('; ') || 'нет данных') + '</p>';
            html += '<p><strong>Минусы:</strong> ' + ((overall.cons || []).join('; ') || 'нет данных') + '</p>';
            html += '</div>';

            html += '<div class="pc-box" style="margin-top:16px;">';
            html += '<h4>Анализ по источникам</h4>';
            data.sources.forEach(s => { html += renderSourceAnalysis(s); });
            html += '</div>';

            addMsg('bot', html, overall, data.overall_wordclouds || null);
        }
        
        document.getElementById('dot').className = 'dot';
        document.getElementById('stxt').textContent = 'Online';
    } catch(e) {
        addMsg('bot', 'Error processing request.');
        document.getElementById('dot').className = 'dot err';
        document.getElementById('stxt').textContent = 'Ошибка';
    }
    busy = false;
    document.getElementById('btn').disabled = false;
}

function clearChat() { location.reload(); }
</script>
</body>
</html>
